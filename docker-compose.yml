name: eaas

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-agent_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command:
      - uvicorn
      - main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      # A new migration file must not trigger a restart: the reloading process
      # runs init_db(), which would apply the revision before you have finished
      # editing it — and then the file you meant to write is orphaned.
      - --reload-exclude=migrations/*
      # Long-lived event streams must not hold a restart open.
      - --timeout-graceful-shutdown=5
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?set NVIDIA_API_KEY in .env}
      MODEL: ${MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-agent_db}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATA_DIR: /data
      # Seals employee credentials at rest. Change it for anything real.
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-key}
      RUN_CONCURRENCY: ${RUN_CONCURRENCY:-2}
      # The org clock starts work on its own, but only for companies that opted
      # in. Off here stops it entirely, whatever a company has set.
      ORG_CLOCK: ${ORG_CLOCK:-1}
      # Container-isolated build toolchains (Go, Rust, the JVM, LaTeX…).
      # Needs a Docker socket, so it is off unless you ask for it.
      ENABLE_RUNNER_PROFILES: ${ENABLE_RUNNER_PROFILES:-0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app             # hot reload during development
      - workspace_data:/data       # project git repositories
      - pub_cache:/opt/pub-cache   # Dart/Flutter packages, so pub get is not re-run cold
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Server-side only: the browser talks to the Next.js proxy at /api/agent.
      API_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  workspace_data:
  pub_cache:

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() defaults are the framework's idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"tests/conftest.py" = ["E402", "F401"]
# Autogenerated by Alembic; the generator owns the formatting.
"migrations/versions/*" = ["E501"]
"migrations/env.py" = ["E402"]
